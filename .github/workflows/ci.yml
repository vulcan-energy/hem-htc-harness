name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,docs,plot]"
      - name: Tests
        run: |
          python -m pytest
      - name: Ruff
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: Licensing and attribution gate
        run: |
          python scripts/check_licensing.py --release
      - name: Identifiable-data sweep
        run: |
          python scripts/check_no_identifiable_data.py
      - name: Browser demo runtime (Pyodide)
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
          npm ci
          npm run test:browser
      - name: Build the demo bundle
        # The wheel and the two glue files are everything the host page needs;
        # the WebAssembly engine it calls is already served from the site.
        #
        # Published rather than committed into the site. A committed wheel that
        # drifts is not a stale asset, it is silently wrong code — the page
        # would report HTC from transforms that no longer match the ones the
        # command line runs, which is the single failure this architecture
        # exists to prevent. A pinned fetch of a missing or moved artifact fails
        # loudly instead.
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          python scripts/build_demo_bundle.py --commit "$GITHUB_SHA"
      - name: Upload the demo bundle
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h3-demo-bundle
          path: |
            demo-bundle/
            h3-demo-bundle.zip
          if-no-files-found: error
          retention-days: 90

      - name: Docs
        run: |
          python -m mkdocs build --strict

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the tested demo bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name h3-demo-bundle \
            --dir release-bundle
      - name: Publish the durable demo bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-bundle/h3-demo-bundle.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
