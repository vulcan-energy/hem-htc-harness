[project]
name = "htc-harness"
version = "0.1.0"
description = "Minimal empirical HTC wrapper for HEM outputs"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = [
    "LICENSE",
    "NOTICE",
    "ADDITIONAL_TERMS.md",
    "ATTRIBUTION.md",
    "TRADEMARKS.md",
    "LICENSES/*",
]
authors = [
    { name = "Home Energy Foundry Limited", email = "info@usevulcan.app" },
]
keywords = ["hem", "htc", "heat-transfer-coefficient", "energy", "buildings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://usevulcan.app/h3"
Source = "https://github.com/vulcan-energy/hem-htc-harness"
Documentation = "https://github.com/vulcan-energy/hem-htc-harness/tree/main/docs"
Issues = "https://github.com/vulcan-energy/hem-htc-harness/issues"

[project.scripts]
htc-harness = "htc_harness.cli:main"
h3 = "htc_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # Pinned to a minor range. Rule *selection* is pinned explicitly under
    # [tool.ruff.lint] below, so a version bump no longer silently changes which
    # rules run — but ruff can still change the behaviour of selected rules
    # between minors, so the range stays narrow.
    "ruff>=0.16,<0.17",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0",
]
plot = [
    "plotly>=6.5,<7",
]

[build-system]
# setuptools>=77 is required for PEP 639 `license` / `license-files` support.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# The browser sandbox's dwelling travels inside the wheel rather than as a
# separate asset the host page has to fetch and keep in step. One artifact
# crosses to the site, and the model is versioned with the transforms that act
# on it — a sandbox model and an `apply_shoebox_levers_to_model` that disagreed
# about the shape of a building element would fail confusingly and late.
#
# The weather rides along for the same reason. The model carries no weather of
# its own, so a sandbox run needs an EPW. The bundled London file is the engine's
# public example weather and keeps the fixed sandbox reproducible. It is MIT and
# Crown Copyright; see NOTICE.
"htc_harness.sandbox" = ["*.json", "*.epw"]

[tool.setuptools.data-files]
"share/htc-harness/patches" = ["patches/manifest.json"]
"share/htc-harness/patches/rust" = ["patches/rust/*.patch"]
"share/htc-harness/patches/fhs" = ["patches/fhs/*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly rather than inherited. Ruff's *default* selection changes
# between minor releases — 0.16 widened it from `E4,E7,E9,F` to 19 rule
# families, which broke CI on an unrelated pull request. Pinning the selection
# here makes lint behaviour a property of this repo, not of whichever ruff
# version CI happened to install.
#
#   E4/E7/E9, F  pycodestyle essentials and pyflakes (ruff's classic default)
#   I            import sorting
#   UP           pyupgrade; this project is Python 3.12+
#
# Adopting further families (B, C4, TRY, S, SIM, ...) is worthwhile but is a
# deliberate change with real diff churn, not a side effect of a version bump.
select = ["E4", "E7", "E9", "F", "I", "UP"]
